services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/truein
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    volumes:
      - server_uploads:/app/uploads
    networks: [backend, frontend]
    expose:
      - "5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx in the client image proxies /api and /v1 to the
        # server container. So VITE_API_URL is relative.
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks: [frontend]

volumes:
  mongo_data:
  redis_data:
  server_uploads:

networks:
  backend:
  frontend:
