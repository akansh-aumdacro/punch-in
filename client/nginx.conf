server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache static assets — Vite hashes filenames, so stale assets
    # never replace fresh ones.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API to the server container. `server` is the docker-compose
    # service name and resolves on the `backend` network.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 25M;
    }

    # Public /v1 API.
    location /v1/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
    }

    # Uploaded files served by the server (logos, profile photos).
    location /uploads/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
    }

    # Socket.IO — needs upgrade headers.
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — anything that isn't a static file or proxied path falls
    # through to index.html for React Router to handle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
